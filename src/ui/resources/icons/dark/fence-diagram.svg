  <line x1="16" y1="92" x2="34" y2="92" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  
  <!-- Middle core -->
  <rect x="45" y="20" width="18" height="92" rx="2" fill="#8B7D73" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="45" y1="38" x2="63" y2="38" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  <line x1="45" y1="56" x2="63" y2="56" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  <line x1="45" y1="74" x2="63" y2="74" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  <line x1="45" y1="92" x2="63" y2="92" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  
  <!-- Right core -->
  <rect x="74" y="20" width="18" height="92" rx="2" fill="#7D6F68" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="74" y1="38" x2="92" y2="38" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  <line x1="74" y1="56" x2="92" y2="56" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  <line x1="74" y1="74" x2="92" y2="74" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  <line x1="74" y1="92" x2="92" y2="92" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  
  <!-- Correlation lines connecting cores (brighter blue for dark mode) -->
  <line x1="34" y1="38" x2="45" y2="38" stroke="#4F9CFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="56" x2="74" y2="56" stroke="#4F9CFF" stroke-width="2" stroke-linecap="round"/>
