  <rect x="16" y="20" width="18" height="92" rx="2" fill="#9D8B7E" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="16" y1="38" x2="34" y2="38" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="56" x2="34" y2="56" stroke="#6B6B6B" stroke-width="1" opacity="0.6"/>
