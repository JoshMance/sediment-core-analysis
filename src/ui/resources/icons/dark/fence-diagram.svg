  <line x1="63" y1="92" x2="74" y2="92" stroke="#4F9CFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bottom label area -->
  <line x1="16" y1="120" x2="92" y2="120" stroke="#94A3B8" stroke-width="1" opacity="0.4"/>
