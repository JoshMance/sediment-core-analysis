# Component topology for sediment-core-analysis
# Code is the source of truth. This file mirrors current code structure.

domain:
  entities:
    - name: DatasetEntity
      fields:
        [
          id,
          name,
          file_path,
          data,
          columns,
          column_types,
          depth_column,
          asset_ref,
        ]
    - name: CoreEntity
      fields:
        [
          id,
          name,
          base_data,
          source_file_path,
          parent_core_id,
          child_core_ids,
          derivation_type,
          derivation_params,
          mm_per_px,
          illuminant,
          filter_stack,
          is_draft,
          dataset_plots,
          asset_ref,
        ]

  propagation_rules:
    - entity_type: CoreEntity
      field: mm_per_px
      direction: down
      via: child_core_ids
      # Declared in src/domain/entities/propagation.py.
      # The Store applies these rules automatically in update_field (BFS, cycle-safe).
    - entity_type: CoreEntity
      field: illuminant
      direction: down
      via: child_core_ids
    - entity_type: CoreEntity
      field: filter_stack
      direction: down
      via: child_core_ids

  components:
    - name: Store
      lifetime: long-lived
      signals: [entityAdded, entityRemoved, entityUpdated, storeReset]
      actions:
        [
          add,
          get,
          get_many,
          get_field,
          list_entities,
          update_field,
          remove,
          count,
          summary,
          clear,
        ]

application:
  components:
    - name: AppController
      lifetime: long-lived
      writes_to: [Store, WorkspaceState]
      actions:
        - import_core_from_image
        - create_core_entity
        - create_child_core
        - open_core_in_studio
        - open_blank_core_studio
        - open_core_studio
        - set_core_mm_per_px
        - delete_entity
        - rename_entity
        - create_dataset_entity
        - create_blank_dataset
        - add_dataset_column
        - remove_dataset_column
        - add_dataset_row
        - remove_dataset_row
        - paste_dataset_data
        - rename_dataset_column
        - change_dataset_column_type
        - update_dataset_cell
        - open_in_workspace
        - new_session
        - save_session
        - load_session
        - set_view_context
        - set_ribbon_tab
        - set_dataset_depth_column
        - set_dataset_plots
        - split_core

    - name: StatusContext
      lifetime: long-lived
      owned_by: AppController
      signals: [contextChanged]
      actions: [set]

    - name: RibbonContext
      lifetime: long-lived
      owned_by: AppController
      signals: [tabRequested]
      actions: [set_tab]

    - name: RecentDirs
      lifetime: long-lived
      owned_by: AppController
      actions: [get, set, clear]

    - name: WorkspaceState
      lifetime: long-lived
      subscribes_to: [Store.entityRemoved, Store.storeReset]
      signals: [panelAdded, panelRemoved, panelFocusRequested]
      actions: [open, close, clear, set_active_panel]
      reads: [active_entity_id]

  services:
    - name: load_image
    - name: load_csv
    - name: session_archive
      actions: [save, load]
    - name: workspace_service
      actions: [open_entity]

ui:
  presenters:
    - name: VariablesPresenter
      views: [VariablesList, PreviewPanel]
      subscribes_to:
        [
          Store.entityAdded,
          Store.entityRemoved,
          Store.entityUpdated,
          Store.storeReset,
        ]
      calls: [AppController]
      view_signals:
        [
          VariablesList.entitySelected,
          VariablesList.deleteRequested,
          VariablesList.renameRequested,
          VariablesList.entityOpenRequested,
        ]

    - name: RibbonPresenter
      view: Ribbon
      subscribes_to: [RibbonContext.tabRequested]
      reads: [Store, WorkspaceState.active_entity_id]
      calls: [AppController]
      view_signals: [Ribbon.buttonClicked]

    - name: StatusBarPresenter
      view: StatusBar
      subscribes_to:
        [
          Store.entityAdded,
          Store.entityRemoved,
          Store.entityUpdated,
          Store.storeReset,
          StatusContext.contextChanged,
        ]
      calls: []

    - name: WorkspacePresenter
      view: WorkspaceView
      subscribes_to:
        [
          WorkspaceState.panelAdded,
          WorkspaceState.panelRemoved,
          WorkspaceState.panelFocusRequested,
          Store.entityUpdated,
        ]
      calls: [WorkspaceState, AppController]
      manages:
        [CoreImagePanelPresenter, DatasetPanelPresenter, CoreStudioPresenter]
      view_signals: [WorkspaceView.entityDropped, WorkspaceView.tabChanged, WorkspaceView.tabClosed]

    - name: CoreImagePanelPresenter
      view: CoreImagePanel
      lifetime: per-panel
      subscribes_to: []
      calls: [AppController]
      view_signals:
        [
          CoreImagePanel.cropConfirmed,
          CoreImagePanel.distanceCalibrated,
          ImageCanvas.cropChanged,
          ImageCanvas.pixelHovered,
          ImageCanvas.pixelLeft,
        ]

    - name: DatasetPanelPresenter
      view: DatasetPanel
      lifetime: per-panel
      subscribes_to: [Store.entityUpdated]
      calls: [AppController]
      view_signals:
        [
          selectionChanged,
          columnSelected,
          DatasetPanel.depthColumnSetRequested,
          DatasetPanel.addColumnRequested,
          DatasetPanel.removeColumnRequested,
          DatasetPanel.addRowRequested,
          DatasetPanel.removeRowRequested,
          DatasetPanel.pasteRequested,
        ]

    - name: CoreStudioPresenter
      view: CoreStudioPanel
      lifetime: per-panel
      subscribes_to: [Store.entityUpdated]
      calls: [AppController]
      view_signals:
        [
          CoreStudioPanel.imageDropped,
          CoreStudioPanel.exportPdfRequested,
          CoreStudioPanel.dataPlotChangeRequested,
        ]

  views:
    - name: Ribbon
      lifetime: long-lived
      signals: [buttonClicked]
      actions: [set_button_enabled, set_active_tab, refresh_icons]

    - name: DatasetPlotDialog
      lifetime: transient
      # Modal dialog opened by CoreStudioPresenter when user clicks "Manage data plots".
      # Receives dataset descriptors and active_plots at construction; emits plotsSelected.
      # No Store access — all data passed in by presenter.
      signals: [plotsSelected]

    - name: SettingsDialog
      lifetime: transient
      # Modal dialog opened by RibbonPresenter via the Settings button.
      # Reads is_dark() at construction; emits themeChanged on accept.
      # No Store access.

    - name: JoinCoresDialog
      lifetime: transient
      # Modal canvas opened by RibbonPresenter via the Edit Join button.
      # No Store access until the join workflow is implemented.

    - name: SplitCoreDialog
      lifetime: transient
      # Opened by RibbonPresenter via the Edit Split button.
      # Receives core descriptors and optional preferred source; emits splitRequested(source_id, axis, position, first_name, second_name).
      signals: [splitRequested]
