# Component topology for sediment-core-analysis
# Code is the source of truth. This file mirrors current code structure.

domain:
  entities:
    - name: ImageEntity
      fields: [id, name, file_path, data, parent_id, child_ids, calibration_id]
    - name: DatasetEntity
      fields: [id, name, file_path, data, columns, column_types, asset_ref]
    - name: CoreEntity
      fields: [id, name, data, source_image_id, asset_ref]
    - name: CalibrationEntity
      fields: [id, mm_per_px]

  components:
    - name: Store
      lifetime: long-lived
      signals: [entityAdded, entityRemoved, entityUpdated, storeReset]
      actions: [add, get, get_many, get_field, list_entities, update_field, remove, count, summary, clear]

  services: []

application:
  components:
    - name: AppController
      lifetime: long-lived
      writes_to: [Store, WorkspaceState]
      actions:
        - create_image_entity
        - create_core_entity
        - create_draft_core_from_image
        - open_core_in_studio
        - open_blank_core_studio
        - create_cropped_image
        - delete_entity
        - rename_entity
        - create_dataset_entity
        - rename_dataset_column
        - change_dataset_column_type
        - update_dataset_cell
        - open_in_workspace
        - new_session
        - save_session
        - load_session
        - set_view_context
        - set_ribbon_tab

    - name: StatusContext
      lifetime: long-lived
      owned_by: AppController
      signals: [contextChanged]
      actions: [set]

    - name: RibbonContext
      lifetime: long-lived
      owned_by: AppController
      signals: [tabRequested]
      actions: [set_tab]

    - name: RecentDirs
      lifetime: long-lived
      owned_by: AppController
      actions: [get, set, clear]

    - name: WorkspaceState
      lifetime: long-lived
      subscribes_to: [Store.entityRemoved, Store.storeReset]
      signals: [panelAdded, panelRemoved, panelFocusRequested]
      actions: [open, close, clear]

  services:
    - name: load_image
    - name: load_csv
    - name: session_archive
      actions: [save, load]
    - name: workspace_service
      actions: [open_entity]

ui:
  presenters:
    - name: FilePresenter
      status: unused
      view: FileBrowser
      subscribes_to: []
      calls: [AppController]

    - name: VariablesPresenter
      views: [VariablesList, PreviewPanel]
      subscribes_to: [Store.entityAdded, Store.entityRemoved, Store.entityUpdated, Store.storeReset]
      calls: [AppController]
      view_signals: [VariablesList.entitySelected, VariablesList.deleteRequested, VariablesList.renameRequested, VariablesList.entityOpenRequested]

    - name: RibbonPresenter
      view: Ribbon
      subscribes_to: [RibbonContext.tabRequested]
      calls: [AppController]

    - name: StatusBarPresenter
      view: StatusBar
      subscribes_to: [Store.entityAdded, Store.entityRemoved, Store.entityUpdated, Store.storeReset, StatusContext.contextChanged]
      calls: []

    - name: WorkspacePresenter
      view: WorkspaceView
      subscribes_to: [WorkspaceState.panelAdded, WorkspaceState.panelRemoved, WorkspaceState.panelFocusRequested, Store.entityUpdated]
      calls: [WorkspaceState, AppController]
      manages: [ImagePanelPresenter, DatasetPanelPresenter, CoreStudioPresenter]
      view_signals: [WorkspaceView.entityDropped, WorkspaceView.tabChanged]

    - name: ImagePanelPresenter
      view: ImagePanel
      lifetime: per-panel
      subscribes_to: []
      calls: [AppController]
      view_signals: [ImagePanel.cropConfirmed, ImageCanvas.cropChanged, ImageCanvas.pixelHovered, ImageCanvas.pixelLeft]

    - name: DatasetPanelPresenter
      view: DatasetPanel
      lifetime: per-panel
      subscribes_to: [Store.entityUpdated]
      calls: [AppController]
      view_signals: [selectionChanged, columnSelected]

    - name: CoreStudioPresenter
      view: CoreStudioPanel
      lifetime: per-panel
      subscribes_to: []
      calls: [AppController]
      view_signals: [CoreStudioPanel.imageDropped]
