[project]
name = "sediment-core-analysis"
version = "0.1.0"
description = "Desktop application for analyzing sediment core images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.8.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "imageio>=2.31.0",
    "pooch>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
